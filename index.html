<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iris Íntima | Alta Lingerie e Moda</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              ouro: '#D4AF37',
              ouroHover: '#AA8209',
              rosaEscuro: '#2C1B22',
              rosaMacio: '#FFF0F5',
              rosaAccent: '#E8A4B8',
              ouroRosa: '#B76E79',
              escuro: '#121212'
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-marca-rosaMacio text-marca-escuro min-f-screen flex flex-col">
  <header class="bg-marca-rosaEscuro text-white sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-serif text-marca-ouro font-bold tracking-wider">Iris Íntima</span>
      </div>
      <div class="flex items-center space-x-4">
        <button onclick="toggleAdminModal()" class="text-xs bg-marca-ouro hover:bg-marca-ouroHover text-white px-3 py-1.5 rounded font-medium transition">Painel Admin</button>
      </div>
    </div>
  </header>
  <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
    <div class="text-center py-12">
      <h1 class="text-4xl font-serif font-bold text-marca-rosaEscuro mb-4">Loja Iris Íntima</h1>
      <p class="text-gray-600">Catálogo atualizado de produtos.</p>
    </div>
  </main>
</body>
</html>
